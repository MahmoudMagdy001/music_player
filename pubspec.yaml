name: music_player
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State management
  flutter_bloc: ^9.1.1
  provider: ^6.0.5
  equatable: ^2.0.8

  # Dependency injection & functional programming
  get_it: ^9.2.1
  fpdart: ^1.2.0

  # Audio
  audio_service: ^0.18.9
  audio_video_progress_bar: ^2.0.3
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.9
  rxdart: ^0.28.0
  youtube_explode_dart: ^3.1.0

  # Networking
  dio: ^5.9.2
  connectivity_plus: ^7.1.1

  # UI
  cached_network_image: ^3.2.3
  flutter_screenutil: ^5.9.3
  icons_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logo.png"
  adaptive_icon_background: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/